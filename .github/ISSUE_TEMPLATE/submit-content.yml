name: 📝 投稿新内容
description: 提交新的词汇、例句、俗语等学习素材
title: "[投稿] "
labels: ["submission", "pending-review"]
body:
  - type: markdown
    attributes:
      value: |
        感谢投稿！请填写以下信息，管理员审核通过后会发布到网站。
        粤拼（Jyutping）可参考：https://jyut.net/

  - type: dropdown
    id: category
    attributes:
      label: 内容类别
      options:
        - 词汇（单词 / 词组）
        - 例句（句型 / 对话）
        - 俗语 / 歇后语
        - 急口令
        - 其他
    validations:
      required: true

  - type: dropdown
    id: lesson
    attributes:
      label: 归入哪一课
      options:
        - 第一课（颜色 / 形状 / 去买嘢 / 俗语 / 急口令）
        - 新课程（管理员会建立）
    validations:
      required: true

  - type: input
    id: jyut
    attributes:
      label: 粤拼（Jyutping）
      description: 粤语罗马拼音，例如 hùhng-sīk
      placeholder: 例如：hùhng-sīk
    validations:
      required: true

  - type: input
    id: zh
    attributes:
      label: 繁体中文
      placeholder: 例如：紅色
    validations:
      required: true

  - type: input
    id: en
    attributes:
      label: 英文 / 普通话对照
      placeholder: 例如：Red
    validations:
      required: true

  - type: textarea
    id: scene
    attributes:
      label: 使用情景（可选）
      description: 俗语 / 例句适用，描述什么场合会用到
      placeholder: 情景：……

  - type: textarea
    id: example
    attributes:
      label: 例句（可选）
      placeholder: 例句……——解释……

  - type: textarea
    id: note
    attributes:
      label: 补充说明（可选）
      placeholder: 字面意思、文化背景、语法要点等

  - type: input
    id: audio
    attributes:
      label: 音频链接（可选）
      description: 如有录音，可提供下载链接（Google Drive、微信文件等）
      placeholder: https://...

  - type: textarea
    id: remarks
    attributes:
      label: 其他备注（可选）
